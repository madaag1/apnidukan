<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Checkout | Apni Dukaan</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="styles.css?v=2" /></head>
<body><header class="simple-header"><a class="brand-link" href="index.html">APNI DUKAAN <span>Premium lifestyle store</span></a><a class="header-link" href="cart.html">Back to cart</a></header><main class="shop-page"><div class="page-heading"><p class="eyebrow">Secure checkout</p><h1>Delivery details</h1><p>We’ll confirm your order before dispatch.</p></div><div class="checkout-layout"><form id="checkoutForm" class="checkout-form"><h2>Contact & delivery</h2><div class="form-grid"><label>Full name<input id="fullName" required autocomplete="name" /></label><label>Mobile number<input id="phone" type="tel" required autocomplete="tel" /></label><label class="full-field">Email address<input id="email" type="email" required autocomplete="email" /></label><label class="full-field">Address<input id="address" required autocomplete="street-address" /></label><label>City<input id="city" required autocomplete="address-level2" /></label><label>PIN code<input id="postalCode" required inputmode="numeric" autocomplete="postal-code" /></label></div><h2>Payment</h2><label class="payment-option"><input type="radio" name="payment" value="cod" checked /> Cash on delivery</label><label class="payment-option"><input type="radio" name="payment" value="whatsapp" /> Confirm payment on WhatsApp</label><p id="checkoutMessage" class="form-message" role="status"></p><button class="button button-primary wide-button" type="submit">Place order</button></form><aside class="order-summary"><h2>Your order</h2><div id="checkoutItems" class="checkout-items"></div><div class="summary-total"><span>Total</span><strong id="checkoutTotal">₹0</strong></div><p class="muted-copy">Your order is saved securely and our team will contact you to confirm it.</p></aside></div></main><script type="module" src="checkout.js"></script></body></html>
